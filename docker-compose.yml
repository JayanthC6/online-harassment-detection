services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shieldai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - PORT=5000
      - DATABASE_URL=sqlite:////app/data/shieldai.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-shieldai_secret_jwt_key_2026}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-5-5}
      - EXTENSION_API_KEY=${EXTENSION_API_KEY:-shieldai-browser-ext-v1}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@ShieldAI2026!}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
    volumes:
      - ./backend/data:/app/data
    networks:
      - shieldai_net
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shieldai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - shieldai_net

networks:
  shieldai_net:
    driver: bridge
