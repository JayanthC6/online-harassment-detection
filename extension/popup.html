<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShieldAI Settings</title>
  <style>
    /* Ink/Panel Aesthetic */
    :root {
      --bg-ink: #0B0C10;
      --bg-panel: #1C1E27;
      --border-color: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-red: #EF4444;
      --accent-green: #10B981;
    }
    
    body {
      width: 340px;
      margin: 0;
      padding: 0;
      background-color: var(--bg-ink);
      color: var(--text-main);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }
    
    .header {
      background-color: var(--bg-panel);
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 0.05em;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-text {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      font-family: ui-monospace, monospace;
    }
    
    .status-active { color: var(--accent-green); }
    .status-inactive { color: var(--text-muted); }
    
    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border-color);
      transition: .2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
    }
    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(16px); }

    .content {
      padding: 16px;
    }
    
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
      font-family: ui-monospace, monospace;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      outline: none;
    }
    
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: var(--text-muted);
    }
    
    .privacy-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 12px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    
    .privacy-notice.hidden {
      display: none;
    }
    
    .privacy-icon {
      color: var(--accent-green);
      font-size: 16px;
    }
    
    .stats-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .stats-count {
      font-size: 24px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      color: var(--accent-red);
    }
    
    .flagged-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    
    .flagged-item {
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 12px;
    }
    .flagged-item:last-child {
      border-bottom: none;
    }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    
    .item-category {
      font-weight: 700;
      color: var(--accent-red);
      font-family: ui-monospace, monospace;
    }
    
    .item-score {
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
    }
    
    .item-preview {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .item-ti {
      margin-top: 4px;
      color: var(--text-main);
      font-size: 11px;
      background: rgba(239, 68, 68, 0.1);
      padding: 2px 4px;
      display: inline-block;
      border-left: 2px solid var(--accent-red);
    }
    
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 12px;
    }
    
    .options-row label.option-label {
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    
    .options-subtext {
      font-size: 10px;
      color: var(--text-muted);
    }
    
    .url-row {
      display: flex;
      gap: 6px;
    }
    
    .btn-save {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      cursor: pointer;
      border-radius: 2px;
    }
    .btn-save:hover { background: #0369A1; }
    
    .url-status {
      font-size: 10.5px;
      margin-top: 4px;
      min-height: 14px;
      font-family: ui-monospace, monospace;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-ink); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1>SHIELD_AI</h1>
    <div class="toggle-container">
      <span id="status-label" class="status-text status-active">SCANNING</span>
      <label class="switch">
        <input type="checkbox" id="toggle-switch" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div class="content">
    <div id="privacy-banner" class="privacy-notice">
      <div class="privacy-icon">✓</div>
      <div><strong>Active</strong> &mdash; ShieldAI is scanning visible messages on this page. No history is stored.</div>
    </div>
    
    <div class="input-group">
      <div class="section-title">Backend Server URL</div>
      <div class="url-row">
        <input type="text" id="server-url" placeholder="http://127.0.0.1:5000" value="http://127.0.0.1:5000">
        <button id="save-url-btn" class="btn-save">SAVE</button>
      </div>
      <div id="url-status" class="url-status"></div>
    </div>

    <!-- Per-site opt-out toggle -->
    <div class="options-row" id="site-opt-row">
      <label class="option-label" for="site-toggle-switch">
        <span id="site-opt-label">Scan this website</span>
        <span class="options-subtext" id="current-domain-label">current site</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="site-toggle-switch" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Safe badges display toggle (default off) -->
    <div class="options-row">
      <label class="option-label" for="show-safe-switch">
        <span>Show Safe Badges</span>
        <span class="options-subtext">Display green badge on clean messages</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-safe-switch">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Unsupported language badges toggle (default off) -->
    <div class="options-row">
      <label class="option-label" for="show-unsupported-switch">
        <span>Show Unsupported Language Badges</span>
        <span class="options-subtext">Display purple badge on non-English text</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="show-unsupported-switch">
        <span class="slider"></span>
      </label>
    </div>

    <div class="input-group">
      <div class="section-title">Extension API Key (Optional)</div>
      <input type="password" id="api-key" placeholder="Enter EXTENSION_API_KEY">
    </div>
    
    <div class="section-title">Current Tab Status</div>
    <div class="stats-card">
      <div>Flagged Threats</div>
      <div class="stats-count" id="flagged-count">0</div>
    </div>
    
    <ul class="flagged-list" id="flagged-list">
      <!-- Flagged items will be injected here -->
    </ul>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
